# PayGuard Application Configuration Example
# Copy this file to application-dev.properties, application-prod.properties, etc.
# and fill in your actual values. NEVER commit sensitive data!

# Database Configuration - REQUIRED
spring.datasource.url=jdbc:postgresql://localhost:5432/payguard
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.servlet.context-path=/
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.tanakarh.payguard=DEBUG

# Security Configuration (when implemented)
# app.jwt.secret=YOUR_SUPER_SECRET_JWT_KEY_HERE
# app.jwt.expiration=86400000

# Application-specific Configuration
app.payment.max-amount=999999.99
app.payment.currency.default=USD