spring.application.name=payguard

# Database Configuration (Use environment variables for sensitive data)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tanaka}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.servlet.context-path=/
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.tanakarh.payguard=DEBUG